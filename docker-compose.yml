services:
  qq-bot:
    build: .
    container_name: my-bot
    restart: unless-stopped
    environment:
      WEBSOCKET_MODE: ${WEBSOCKET_MODE:-server}
      NAPCAT_WS_URL: ${NAPCAT_WS_URL:-ws://host.docker.internal:3001}
      NAPCAT_ACCESS_TOKEN: ${NAPCAT_ACCESS_TOKEN:-}
      BOT_QQ: ${BOT_QQ:-}
      LISTEN_HOST: ${LISTEN_HOST:-0.0.0.0}
      LISTEN_PORT: ${LISTEN_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RECONNECT_SECONDS: ${RECONNECT_SECONDS:-5}
      AUTO_CANDY_QQ: ${AUTO_CANDY_QQ:-}
      AUTO_EMOJI_IDS: ${AUTO_EMOJI_IDS:-127852,12951}
      AUTO_CANDY_EMOJI_ID: ${AUTO_CANDY_EMOJI_ID:-127852}
      SONG_MAX_DOWNLOAD_MB: ${SONG_MAX_DOWNLOAD_MB:-80}
      SONG_SESSION_MINUTES: ${SONG_SESSION_MINUTES:-10}
      QUARK_COOKIE: ${QUARK_COOKIE:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE_URL: ${DEEPSEEK_API_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      BOT_PLUGIN_CONFIG: /app/plugin_config.json
    volumes:
      - ./plugin_config.json:/app/plugin_config.json:ro
    networks:
      qqbot-net:
        aliases:
          - my-bot

networks:
  qqbot-net:
    external: true
